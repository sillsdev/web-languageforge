memory_limit = 256M
post_max_size = 60M
upload_max_filesize = 60M
xdebug.log_level = 0

; Defence in depth for CVE-2026-109619 (RCE via stale global state).
; The session upload-progress feature is one of the confirmed attack paths and
; Language Forge does not use it. Must be set here (not via ini_set) so it
; applies before request initialisation.
session.upload_progress.enabled = Off
