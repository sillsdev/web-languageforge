name: Integrate changes and deploy

# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#on
on:
  workflow_call:
    # https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#onworkflow_callinputs
    inputs:
      image-tag-app:
        type: string
        required: true
      image-tag-proxy:
        type: string
        required: true
      image-tag-next-app:
        type: string
        required: true
      k8s-environment:
        description: "Folder under languageforge/ in the fleet repo to deploy to: staging or production"
        type: string
        required: true
      deploy-domain:
        description: "The domain the environment is served from, shown on the deployment"
        type: string
        required: true

    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_callsecrets
    secrets:
      fleet-repo-ssh-key:
        description: "Deploy key with write access to the fleet repo named by the FLEET_REPO repository variable"
        required: true
      image-repo-username:
        required: true
      image-repo-password:
        required: true

jobs:
  integrate:
    runs-on: ubuntu-latest

    env:
      # https://docs.docker.com/develop/develop-images/build_enhancements/
      DOCKER_BUILDKIT: 1

    steps:
      -
        uses: actions/checkout@v4
      -
        run: |
          docker --version
          docker compose version
      -
        name: Establish image name
        id: image
        run: |
          echo "NAMESPACE=sillsdev/web-languageforge" >> $GITHUB_OUTPUT
          echo "TAG_APP=${{ inputs.image-tag-app }}" >> $GITHUB_OUTPUT
          echo "TAG_PROXY=${{ inputs.image-tag-proxy }}" >> $GITHUB_OUTPUT
          echo "TAG_NEXT_APP=${{ inputs.image-tag-next-app }}" >> $GITHUB_OUTPUT
          echo "LFMERGE_NAMESPACE=ghcr.io/sillsdev/lfmerge" >> $GITHUB_OUTPUT

          # Get LfMerge tag from Dockerfile, fallback to "latest" as default if that fails
          TAG_LFMERGE=$(head -n 1 docker/lfmerge/Dockerfile | cut -d: -f2)
          TAG_LFMERGE=${TAG_LFMERGE:-latest}
          echo "TAG_LFMERGE=${TAG_LFMERGE}" >> $GITHUB_OUTPUT
      -
        uses: pnpm/action-setup@v4
      -
        uses: actions/setup-node@v4
        with:
          node-version: '22.2.0'
          cache: 'pnpm'
      -
        run: pnpm install
      -
        name: Build legacy app
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml build --build-arg BUILD_VERSION=${{ steps.image.outputs.TAG_APP }} app
      -
        name: Verify version stamping
        run: |
          docker run --rm lf-app head build-version.txt version.php
          docker run --rm lf-app head version.php | grep -q ${{ steps.image.outputs.TAG_APP }}
      -
        name: Build "next" images
        run: make build-next
      -
        name: Unit Tests
        run: make unit-tests-ci
      -
        name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.image-repo-username }}
          password: ${{ secrets.image-repo-password }}
      -
        name: Tag images
        run: |
          docker tag lf-app ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_APP }}
          docker tag lf-next-proxy ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_PROXY }}
          docker tag lf-next-app ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_NEXT_APP }}
      -
        run: docker images
      -
        name: Publish images
        run: docker push --all-tags ${{ steps.image.outputs.NAMESPACE }}

    outputs:
      TAG_APP: ${{ steps.image.outputs.TAG_APP }}
      TAG_PROXY: ${{ steps.image.outputs.TAG_PROXY }}
      TAG_NEXT_APP: ${{ steps.image.outputs.TAG_NEXT_APP }}
      TAG_LFMERGE: ${{ steps.image.outputs.TAG_LFMERGE }}
      IMAGE_APP: ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_APP }}
      IMAGE_PROXY: ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_PROXY }}
      IMAGE_NEXT_APP: ${{ steps.image.outputs.NAMESPACE }}:${{ steps.image.outputs.TAG_NEXT_APP }}
      IMAGE_LFMERGE: ${{ steps.image.outputs.LFMERGE_NAMESPACE }}:${{ steps.image.outputs.TAG_LFMERGE }}

  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yml

  deploy:
    # Deploys by bumping the image tags in the fleet repo (vars.FLEET_REPO, the
    # same repo LexBox deploys through). Fleet watches that repo and rolls the
    # cluster forward; nothing here talks to Kubernetes directly.
    #
    # The deploy checks out and pushes to the fleet repo, so two deploys to the
    # same environment at once could conflict on push. Serialise per environment.
    concurrency: ${{ inputs.k8s-environment }}
    runs-on: ubuntu-latest

    needs: [integrate, e2e-tests]

    environment:
      name: ${{ inputs.k8s-environment }}
      url: https://${{ inputs.deploy-domain }}

    steps:
      -
        name: Checkout fleet repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.FLEET_REPO }}
          ssh-key: ${{ secrets.fleet-repo-ssh-key }}
          path: fleet
          ref: main
      -
        # The image-tag-* inputs contain shell substitutions such as $(date +%Y%m%d).
        # The integrate job expands them in a shell step and exposes the results as
        # outputs; use those, never the raw inputs, or the literal "$(date ...)"
        # ends up in the kustomization.
        name: Update image tags in fleet kustomization.yaml
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        env:
          KUSTOMIZATION: fleet/languageforge/${{ inputs.k8s-environment }}/kustomize/kustomization.yaml
          TAG_APP: ${{ needs.integrate.outputs.TAG_APP }}
          TAG_PROXY: ${{ needs.integrate.outputs.TAG_PROXY }}
          TAG_NEXT_APP: ${{ needs.integrate.outputs.TAG_NEXT_APP }}
          TAG_LFMERGE: ${{ needs.integrate.outputs.TAG_LFMERGE }}
        with:
          cmd: |
            yq eval -i '
              (.images[] | select(.name == "sillsdev/web-languageforge").newTag) = strenv(TAG_APP) |
              (.images[] | select(.name == "sillsdev/web-languageforge-next-proxy").newTag) = strenv(TAG_PROXY) |
              (.images[] | select(.name == "sillsdev/web-languageforge-next-app").newTag) = strenv(TAG_NEXT_APP) |
              (.images[] | select(.name == "ghcr.io/sillsdev/lfmerge").newTag) = strenv(TAG_LFMERGE)
            ' "$KUSTOMIZATION"
      -
        name: Show resulting image tags
        run: grep -E "name:|newTag:" "fleet/languageforge/${{ inputs.k8s-environment }}/kustomize/kustomization.yaml"
      -
        name: Push to fleet repo
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          default_author: github_actions
          message: "[Language Forge] Update ${{ inputs.k8s-environment }} images to ${{ needs.integrate.outputs.TAG_APP }}"
          cwd: "./fleet/"
          add: "languageforge/${{ inputs.k8s-environment }}/*"
          push: true
